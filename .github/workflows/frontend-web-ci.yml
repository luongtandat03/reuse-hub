name: Frontend Web CI
run-name: ${{ github.actor }}

on:
  push:
    branches: [ "main"]
    paths:
      - 'reuse-hub/FE/reuse-hub-frontend/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: ./reuse-hub/FE/reuse-hub-frontend/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: ./reuse-hub/FE/reuse-hub-frontend

    - name: Build project
      run: npm run build
      working-directory: ./reuse-hub/FE/reuse-hub-frontend
    
    - name: Run Tests
      run: npm run test
      working-directory: ./reuse-hub/FE/reuse-hub-frontend

    - name: Run Lint
      run: npm run lint
      working-directory: ./reuse-hub/FE/reuse-hub-frontend

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: ./reuse-hub/FE/reuse-hub-frontend
        file: ./reuse-hub/FE/reuse-hub-frontend/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/frontend-web:${{ github.sha }}
