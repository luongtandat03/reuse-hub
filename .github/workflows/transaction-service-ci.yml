name: Continuous Integration Pipeline For Transaction Service (Maven Build, Test, Package, Docker)
run-name: ${{ github.actor }}

on:
  push:
    branches: ["main"]
    paths: 
      - 'reuse-hub-backend/transaction-service/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transaction
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17 
        uses: actions/setup-java@v4
        with: 
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests (Unit Test & Integration Test)
        run: mvn test
        working-directory: ./reuse-hub-backend/transaction-service
      
      - name: Build with Maven
        run: mvn package -DskipTests
        working-directory: ./reuse-hub-backend/transaction-service

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKERHUB_USERNAME }} 
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and Push Docker Image 
        uses: docker/build-push-action@v6
        with: 
          context: ./reuse-hub-backend/transaction-service
          file: ./reuse-hub-backend/transaction-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/transaction-service:latest