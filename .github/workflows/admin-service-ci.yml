name: Continuous Integration Pipeline (Maven Build, Test, Package, Docker)
run-name: ${{ github.actor }}

on:
  push:
    branches: ["main"]
    paths: 
      - 'reuse-hub-backend/admin-service/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up JDK 17 
        uses: actions/setup-java@v3
        with: 
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests (Unit Test & Integration Test)
        run: mvn test
        working-directory: ./reuse-hub-backend/admin-service
      
      - name: Build with Maven
        run: mvn package -DskipTests
        working-directory: ./reuse-hub-backend/admin-service

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKERHUB_USERNAME }} 
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and Push Docker Image 
        uses: docker/build-push-action@v6
        with: 
          context: ./reuse-hub-backend/admin-service
          file: ./reuse-hub-backend/admin-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/admin-service:${{ github.sha }}