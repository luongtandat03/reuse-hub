apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: reuse-hub
  labels:
    app: transaction-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      containers:
        - name: transaction-service
          image: reuse-hub/transaction-service:latest
          ports:
            - containerPort: 8084
          envFrom:  
            - configMapRef:
                name: reuse-hub-config
            - secretRef:
                name: reuse-hub-secret
          env:
            - name: DATABASE_URL_TRANSACTION
              valueFrom: 
                configMapKeyRef:
                  name: reuse-hub-config
                  key: DATABASE_URL_TRANSACTION
            - name: DATABASE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: reuse-hub-config
                  key: DATABASE_USERNAME
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reuse-hub-secret
                  key: DATABASE_PASSWORD
            - name: BACKEND_SERVICE
              valueFrom:
                configMapKeyRef:
                  name: reuse-hub-config
                  key: BACKEND_SERVICE_TRANSACTION
          resources:
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: reuse-hub
spec:
  selector:
    app: transaction-service
  ports:
    - name: http
      protocol: TCP
      port: 8084
      targetPort: 8084
