apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: reuse-hub
  labels:
    app: identity-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
        - name: identity-service
          image: luongtandat512/identity-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: reuse-hub-config
            - secretRef:
                name: reuse-hub-secret
          env:
            - name: DATABASE_URL_IDENTITY
              valueFrom:
                secretKeyRef:
                  name: reuse-hub-secret
                  key: DATABASE_URL_IDENTITY
            - name: DATABASE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: reuse-hub-config
                  key: DATABASE_USERNAME
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reuse-hub-secret
                  key: DATABASE_PASSWORD
            - name: BACKEND_SERVICE
              valueFrom:
                configMapKeyRef:
                  name: reuse-hub-config
                  key: BACKEND_SERVICE_IDENTITY
          resources:
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: reuse-hub
spec:
  selector:
    app: identity-service
  ports:
    - name: http
      protocol: TCP
      port: 8081
      targetPort: 8081
