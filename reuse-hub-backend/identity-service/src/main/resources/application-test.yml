spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:postgresql://localhost:5432/identity 
    username: postgres
    password: postgres
    
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

    
jwt:  
    expiryDay: 7
    expiryMinutes: 10080
    refreshKey: dummy_value
    accessKey: dummy_value

feign:
  client:
    config:
      profile-service:
        url: "${PROFILE_SERVICE_URL:http://localhost:8082}/profile-feign"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
openapi:
  service:
    api-docs: reuse-hub-api-docs
    server: ${BACKEND_SERVICE:http://localhost:${server.port}}
    title: reuse-hub
    version: 1.0.0