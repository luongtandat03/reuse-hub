spring:
  config:
    activate:
      on-profile: test

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_ON_EXIT=false;MODE=PostgreSQL
    username: sa
    password: ""
    
jwt:
    expiryDay: dummy_value
    expiryMinutes: dummy_value
    refreshKey: dummy_value
    accessKey: dummy_value

feign:
  client:
    config:
      profile-service:
        url: "${PROFILE_SERVICE_URL:http://localhost:8082}/profile-feign"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
openapi:
  service:
    api-docs: reuse-hub-api-docs
    server: ${BACKEND_SERVICE:http://localhost:${server.port}}
    title: reuse-hub
    version: 1.0.0