spring:
  config:
    activate:
      on-profile: test

  data:
    mongodb:
      uri: mongodb://localhost:27017
      database: chat

file:
  upload:
    max-size: ${FILE_MAX_SIZE:10}
    allowed-types: image/jpeg,image/png,image/gif,image/webp
    max-images: ${MAX_IMAGES:10}
    image:
      max-width: ${IMAGE_MAX_WIDTH:1920}
      max-height: ${IMAGE_MAX_HEIGHT:1080}
      thumbnail-size: ${THUMBNAIL_WIDTH:300}
      compress-quality: ${COMPRESS_QUALITY:0.8}

websocket:
  allow-origin: "*"
  endpoint: /ws
  destination-prefix: /topic,/queue
  application-prefix: /app
  user-destination-prefix: /user

rabbitmq:
  exchange:
    chat: ex.chat
    notification: ex.notification
  routing-keys:
    message: rk.message
    notification: rk.notification.send

supabase:
  url: dummy_value
  service-key: dummy_value
  bucket: dummy_value
  public-url: dummy_value


feign:
  client:
    config:
      profile-service:
        url: "http://localhost:8082"
      item-service:
        url: "http://localhost:8083"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

openapi:
  service:
    api-docs: reuse-hub-api-docs
    server: ${BACKEND_SERVICE:http://localhost:${server.port}}
    title: chat-service
    version: 0.0.1