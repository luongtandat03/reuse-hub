spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:postgresql://localhost:5432/profile
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
      
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        spatial:
          dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect



supabase:
  url: dummy_value_for_test_only
  service-key: dummy_value_for_test_only
  bucket: dummy_value_for_test_only
  public-url: dummy_value_for_test_only

file:
  upload:
    max-size: 50
    allowed-types: image/jpeg,image/png,image/gif,image/webp
    max-images: 10
    image:
      max-width: 1920
      max-height: 1080
      thumbnail-size: 300
      compress-quality: 0.8

avatar:
  default: dummy_value_for_test_only

rabbitmq:
  queues:
    user-profile-creation: q.profile.create
    wallet:
      credit: q.wallet.credit

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

openapi:
  service:
    api-docs: reuse-hub-api-docs
    server: ${BACKEND_SERVICE:http://localhost:${server.port}}
    title: profile-service
    version: 1.0.0
