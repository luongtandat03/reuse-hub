spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:postgresql://localhost:5432/payment
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        spatial:
          dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect



stripe:
  api:
    key: dummy_value_for_test_only
  webhook:
    secret: dummy_value_for_test_only

rabbitmq:
  exchange:
    notification: ex.notification
    saga: ex.saga
  routing-key:
    saga:
      payment-completed: r.saga.payment-completed
      payment-failed: r.saga.payment-failed
    notification: r.notification.send
    transaction: r.transaction.cancelled
  queue:
    saga:
      payment-refund: q.saga.payment-refund
      payment-completed: q.saga.payment-completed
      payment-failed: q.saga.payment-failed
      

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

openapi:
  service:
    api-docs: reuse-hub-api-docs
    server: ${BACKEND_SERVICE:http://localhost:${server.port}}
    title: reuse-hub
    version: 1.0.0
