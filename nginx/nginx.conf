worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid; 

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65s;
    keepalive_requests 1000;
    tcp_nopush     on;
    tcp_nodelay     on;

    server_tokens off;

    client_max_body_size 10M;
    client_body_timeout 15s;
    client_header_timeout 15s;
    large_client_header_buffers 4 8k;
    
    gzip on;
    gzip_vary on;
    gzip_proxied      any;
    gzip_comp_level   6;        
    gzip_min_length   1024;     
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain  
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        image/svg+xml
        application/xml
        font/woff2;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time '               
                    'uct=$upstream_connect_time '     
                    'uht=$upstream_header_time '      
                    'urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main buffer=16k flush=5s;

    limit_req_zone $binary_remote_addr zone=api_limit:10m   rate=30r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;

    proxy_connect_timeout  10s;
    proxy_send_timeout     60s;
    proxy_read_timeout     60s;

    proxy_buffering        on;
    proxy_buffer_size      8k;
    proxy_buffers          8 8k;

    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    upstream api-gateway {
        server api-gateway:8080;
        keepalive 32;               
        keepalive_requests 1000;
        keepalive_timeout  60s;
    }

    upstream frontend {
        server frontend-web:80;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Frame-Options        "SAMEORIGIN"                       always;
        add_header X-Content-Type-Options "nosniff"                          always;
        add_header X-XSS-Protection       "1; mode=block"                    always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
        add_header X-Request-ID           $request_id                        always;

        # ================= HEALTH =================
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # ================= API =================
        location /api/ {
            imit_req  zone=api_limit burst=50 nodelay;  
            limit_conn conn_limit 20;                   

            proxy_pass http://api-gateway/api/;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # ================= WEBSOCKET =================
        location /ws/ {
            proxy_pass http://api-gateway/ws/;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
    
            proxy_read_timeout 86400;
            proxy_send_timeout  86400;

            proxy_buffering off;
            proxy_cache     off;

            proxy_next_upstream off;
        }

        # ================= FRONTEND =================
        location / {
            limit_req  zone=general_limit burst=100 nodelay;
            limit_conn conn_limit 30;

            proxy_pass http://frontend;
        }

        location ~ /\. {
            deny all;
            access_log  off;
            log_not_found off;
        }

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}